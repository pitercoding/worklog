name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel the previous run of the same branch/PR when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # The integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend (build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (also type-checks the app)
        run: npm run build

      - name: Run unit tests
        run: npm run test:ci
