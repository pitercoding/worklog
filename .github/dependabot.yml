version: 2

updates:
  # Backend: Spring Boot, Flyway, PostgreSQL driver, springdoc, test libraries
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # Frontend: Angular, RxJS, Karma/Jasmine, TypeScript
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Angular packages must be updated together.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/*"
    ignore:
      # Major upgrades of these need `ng update` and manual migration, so they are done by hand.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
