# Production profile: activate with SPRING_PROFILES_ACTIVE=prod
spring.jpa.show-sql=false

# Small connection pool: free PostgreSQL plans (Neon) allow only a few connections.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# The database may be waking up from sleep on the first request, so wait longer for a connection.
spring.datasource.hikari.connection-timeout=30000
