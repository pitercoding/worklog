spring.application.name=backend
server.port=${PORT:8080}

# Database (override with environment variables in other environments)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/worklog}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
# The mappers read lazy relations while building responses, so the session stays open during the request.
spring.jpa.open-in-view=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway: a database created before migrations existed (by Hibernate) is adopted as version 1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Time zone used to decide what "today" is for workdays (blank = server default).
# Example: APP_TIMEZONE=America/Sao_Paulo
app.timezone=${APP_TIMEZONE:}

# CORS: comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
